name: Publish

# Builds the single image and pushes it to ghcr.io/laupernoe/plimail:
#   push to main  -> latest, sha-<short sha>
#   tag vX.Y.Z    -> X.Y.Z, X.Y, sha-<short sha> (a prerelease tag such as v1.2.0-rc.1 gets only
#                    its own version, never latest)
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/laupernoe/plimail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.source=https://github.com/laupernoe/plimail
            org.opencontainers.image.licenses=AGPL-3.0-only

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          build-args: |
            BUILD_SHA=${{ github.sha }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('APP_VERSION={0}', github.ref_name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
